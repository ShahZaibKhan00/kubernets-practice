kind: Job
apiVersion: batch/v1
metadata:
  name: demo-job
  namespace: nginx

spec:
  completions: 1
  parallelism: 1    # agr count 1 sy ziada howa to pod bhi utny he create hongy is job k lia
  template:
    metadata:
      name: demo-job-data
      labels: 
        app: batch-task
    spec:
      containers:
      - name: batch-container
        image: busybox:latest
        command: ["sh", "-c", "echo Hello World! && sleep 10"]
      restartPolicy: Never 
